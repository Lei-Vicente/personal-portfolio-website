<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Shadow & Base -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)" />

  <!-- Aesthetic Neon Ambient Inner Ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" />

  <!-- Monogram LV (Centered, Bold Geometric) -->
  <text
    x="31"
    y="41.5"
    font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif"
    font-weight="900"
    font-size="26"
    letter-spacing="-1"
    text-anchor="middle"
    fill="url(#textGrad)"
  >LV</text>

  <!-- Active Emerald Online Status Pulse Dot -->
  <circle cx="48.5" cy="18.5" r="4" fill="#10B981" />
  <circle cx="48.5" cy="18.5" r="5.5" fill="none" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.5" />
</svg>
